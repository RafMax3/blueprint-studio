<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost">
  <title>Blueprint Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo"></span>
        <span class="brand-name">Blueprint<em>Studio</em></span>
      </div>
      <div class="toolbar" id="toolbar">
        <button class="btn" data-action="new" title="Nouveau graphique (Ctrl+N)">Nouveau</button>
        <button class="btn" data-action="open" title="Ouvrir un graphique (Ctrl+O)">Ouvrir</button>
        <button class="btn" data-action="save" title="Enregistrer (Ctrl+S)">Enregistrer</button>
        <button class="btn accent" data-action="export" title="Exporter le code généré (Ctrl+E)">Exporter le code</button>
        <span class="vsep"></span>
        <button class="btn icon" data-action="undo" title="Annuler (Ctrl+Z)">&#8630;</button>
        <button class="btn icon" data-action="redo" title="Rétablir (Ctrl+Y)">&#8631;</button>
        <button class="btn icon" data-action="delete" title="Supprimer la sélection (Suppr)">&#10005;</button>
        <span class="vsep"></span>
        <div class="zoom">
          <button class="btn icon" data-action="zoom-out" title="Zoom arrière">&#8722;</button>
          <span id="zoomLabel" class="zoom-label">100 %</span>
          <button class="btn icon" data-action="zoom-in" title="Zoom avant">+</button>
          <button class="btn" data-action="fit" title="Ajuster la vue">Ajuster</button>
        </div>
        <select id="exampleSelect" class="btn select" title="Charger un exemple"></select>
      </div>
      <div class="filename" id="filename">Sans titre</div>
    </header>

    <main class="workspace">
      <aside class="palette">
        <div class="palette-head">
          <input id="search" type="search" placeholder="Rechercher un nœud…" spellcheck="false">
        </div>
        <div class="palette-list" id="paletteList"></div>
        <div class="palette-foot">Cliquez ou glissez un nœud sur le canvas.</div>
      </aside>

      <section id="viewport" class="editor-host"></section>

      <aside class="output">
        <div class="tabs" id="langTabs"></div>
        <div class="code-wrap"><pre id="code" class="code"></pre></div>
        <div class="problems" id="problems"></div>
      </aside>
    </main>

    <footer class="statusbar">
      <span id="statusNodes">0 nœud</span>
      <span class="dot-sep">·</span>
      <span id="statusWires">0 liaison</span>
      <span id="statusProblems" class="status-problems ok">Aucun problème</span>
      <span class="spacer"></span>
      <span class="hint">Molette = zoom · glisser le fond = déplacer · double-clic sur le fond = recherche</span>
    </footer>

    <div id="toast" class="toast"></div>
  </div>

  <script src="js/nodes.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/codegen.js"></script>
  <script src="js/examples.js"></script>
  <script src="js/view.js"></script>
  <script src="js/desktop-bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
